name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never interrupt publication or allow two runs to change the same release together.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks-and-build:
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    needs: checks-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out only the publisher, with no persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Download this run's verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: webos-package
          path: dist
      - name: Complete draft or verify existing published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/publish-release.py
